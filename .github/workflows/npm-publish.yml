name: Publish to npm

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Release @steerprotocol/eas-store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install latest npm CLI
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck package
        run: npm run typecheck

      - name: Test package with coverage
        run: npm test -- --coverage

      - name: Build package
        run: npm run build

      - name: Release package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm run release
