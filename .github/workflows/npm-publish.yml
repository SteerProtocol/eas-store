name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @steerprotocol/eas-store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck SDK
        run: npm run typecheck

      - name: Test SDK with coverage
        run: npm test -- --coverage

      - name: Build SDK
        run: npm run build

      - name: Publish package
        run: npm publish --access public
